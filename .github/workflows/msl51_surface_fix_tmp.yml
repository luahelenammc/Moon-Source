name: Temporary MSL 5.1 stale-current fix

on:
  push:
    branches:
      - chat/msl-5.1-release-coherence-20260909

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining current-state 5.0 labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('MOON_SOURCE_AI_KERNEL.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('`portables/msl/MSL_5_1.md` — current public structural grammar for semantic passage and materialization. MSL is currently 5.0.', '`portables/msl/MSL_5_1.md` — current public structural grammar for semantic passage and materialization. MSL is currently 5.1.')
          p.write_text(t, encoding='utf-8', newline='\n')

          p = Path('DOWNLOADS.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('The MSL 5.0 package carries the exact canonical body, including its explicit formatting contract; the README is a routing facade.', 'The MSL 5.1 package carries the exact canonical body, including its explicit formatting contract; the README is a routing facade.')
          p.write_text(t, encoding='utf-8', newline='\n')

          p = Path('registry/PUBLIC_CAPABILITIES.md')
          t = p.read_text(encoding='utf-8')
          old = '| moon-source-language | [Moon Source Language](../portables/msl/README.md) | sovereign semantic passage grammar | 5.0 | current | [MSL_5_1.md](../portables/msl/MSL_5_1.md#first-use) | [ZIP](../downloads/moon-source-language-5.1.zip) |'
          new = '| moon-source-language | [Moon Source Language](../portables/msl/README.md) | sovereign semantic passage grammar | 5.1 | current | [MSL_5_1.md](../portables/msl/MSL_5_1.md#first-use) | [ZIP](../downloads/moon-source-language-5.1.zip) |'
          if old not in t:
              raise SystemExit('expected human-registry MSL row not found')
          p.write_text(t.replace(old, new), encoding='utf-8', newline='\n')

          p = Path('registry/public-capabilities.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          msl = next(c for c in data['capabilities'] if c.get('title') == 'Moon Source Language')
          msl['claim_ceiling'] = msl['claim_ceiling'].replace('Published MSL 5.0', 'Published MSL 5.1')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate release state
        shell: bash
        run: |
          python scripts/update_capability_digest.py --check
          python scripts/validate_public_capabilities.py
          python - <<'PY'
          from pathlib import Path
          import json
          assert 'MSL is currently 5.0' not in Path('MOON_SOURCE_AI_KERNEL.md').read_text(encoding='utf-8')
          assert 'The MSL 5.0 package carries' not in Path('DOWNLOADS.md').read_text(encoding='utf-8')
          row = next(line for line in Path('registry/PUBLIC_CAPABILITIES.md').read_text(encoding='utf-8').splitlines() if line.startswith('| moon-source-language |'))
          assert '| 5.1 | current |' in row
          data = json.loads(Path('registry/public-capabilities.json').read_text(encoding='utf-8'))
          msl = next(c for c in data['capabilities'] if c.get('title') == 'Moon Source Language')
          assert msl['version'] == '5.1'
          assert 'Published MSL 5.1' in msl['claim_ceiling']
          print('MSL 5.1 current-state labels verified')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/msl51_surface_fix_tmp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix remaining MSL 5.1 current-state labels [skip ci]"
          git push origin HEAD
