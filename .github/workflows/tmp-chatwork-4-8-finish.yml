name: Temporary Chat-Work 4.8 finisher

on:
  push:
    branches:
      - chat/chat-work-4-8-calibration-disclaimer-20260909

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/chat-work-4-8-calibration-disclaimer-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh canonical SHA
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          canonical = Path('portables/chat-work/CHAT_WORK_ROUTING_PROTOCOL_V4.md')
          registry_path = Path('registry/public-capabilities.json')
          data = json.loads(registry_path.read_text(encoding='utf-8'))
          entry = next(c for c in data['capabilities'] if c['id'] == 'chat-work-routing')
          entry['distribution']['canonical_sha256'] = hashlib.sha256(canonical.read_bytes()).hexdigest()
          registry_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Refresh README digest
        run: python scripts/update_capability_digest.py
      - name: Preserve finished candidate and retire workflow
        run: |
          git config user.name "Lua H. Moon M. C."
          git config user.email "luahelenammc@gmail.com"
          git rm .github/workflows/tmp-chatwork-4-8-finish.yml
          git add -A
          git commit -m "docs: finalize Chat-Work 4.8 calibration disclaimer"
          git push origin HEAD:chat/chat-work-4-8-calibration-disclaimer-20260909
      - name: Check links
        run: python scripts/check_links.py
      - name: Validate public capabilities
        run: python scripts/validate_public_capabilities.py
      - name: Check kernel package
        run: python scripts/check_kernel_package.py
      - name: Check title-version separation
        run: python scripts/check_title_version_separation.py
      - name: Test title-version separation
        run: python scripts/test_title_version_separation.py
      - name: Test links
        run: python scripts/test_check_links.py
      - name: Check public stamps
        run: python scripts/check_public_stamps.py
      - name: Test public stamps
        run: python scripts/test_public_stamps.py
      - name: Check capability digest
        run: python scripts/update_capability_digest.py --check
