name: Verify external Adaptive Orchestration compatibility projections

on:
  push:
    branches: [main]
    paths:
      - "downloads/adaptive-orchestration-protocol.zip"
      - "downloads/chat-work-routing-protocol.zip"
      - "downloads/skills/moon-adaptive-orchestration.zip"
      - "downloads/skills/source/moon-adaptive-orchestration/SKILL.md"
      - "downloads/external-projections/aop-compatibility.json"
      - "portables/adaptive-orchestration/**"
      - "portables/chat-work/**"
      - "scripts/check_aop_compatibility.py"
      - ".github/workflows/verify-adaptive-orchestration-package.yml"
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: luahelenammc/Adaptive-Orchestration-Protocol
          ref: main
          path: aop-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: luahelenammc/LUAHELENA
          ref: main
          path: site
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Confirm canonical AOP package build
        run: python aop-source/scripts/build_packages.py --check
      - name: Compare pinned source, compatibility ZIPs, pointers and site mirrors
        run: python scripts/check_aop_compatibility.py --source-root aop-source --site-root site

