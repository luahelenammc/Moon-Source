name: Temporary Chat-Work 4.8 kernel coherence

on:
  push:
    branches:
      - chat/chat-work-4-8-calibration-disclaimer-20260909

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/chat-work-4-8-calibration-disclaimer-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild kernel package from canonical bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          source = Path('MOON_SOURCE_AI_KERNEL.md')
          package = Path('downloads/moon-source-ai-kernel.zip')
          info = ZipInfo(source.name, date_time=(1980, 1, 1, 0, 0, 0))
          info.create_system = 3
          info.external_attr = 0o100644 << 16
          info.compress_type = ZIP_DEFLATED
          with ZipFile(package, 'w', compression=ZIP_DEFLATED) as archive:
              archive.writestr(info, source.read_bytes())
          PY
      - name: Preserve package coherence and retire workflow
        run: |
          git config user.name "Lua H. Moon M. C."
          git config user.email "luahelenammc@gmail.com"
          git rm .github/workflows/tmp-chatwork-4-8-kernel-coherence.yml
          git add -A
          git commit -m "chore: restore kernel package byte coherence"
          git push origin HEAD:chat/chat-work-4-8-calibration-disclaimer-20260909
      - name: Check links
        run: python scripts/check_links.py
      - name: Validate public capabilities
        run: python scripts/validate_public_capabilities.py
      - name: Check kernel package
        run: python scripts/check_kernel_package.py
      - name: Check title-version separation
        run: python scripts/check_title_version_separation.py
      - name: Test title-version separation
        run: python scripts/test_title_version_separation.py
      - name: Test links
        run: python scripts/test_check_links.py
      - name: Check public stamps
        run: python scripts/check_public_stamps.py
      - name: Test public stamps
        run: python scripts/test_public_stamps.py
      - name: Check capability digest
        run: python scripts/update_capability_digest.py --check
