name: Temporary visibility-neutral version normalization

on:
  push:
    branches:
      - meta/drop-public-version-suffix-final-20260909

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/_normalize_version_visibility_tmp.py
      - run: python scripts/update_capability_digest.py
      - run: python scripts/check_version_visibility.py
      - run: python scripts/check_links.py
      - run: python scripts/validate_public_capabilities.py
      - run: python scripts/check_kernel_package.py
      - run: python scripts/check_title_version_separation.py
      - run: python scripts/test_title_version_separation.py
      - run: python scripts/check_public_stamps.py
      - run: python scripts/test_public_stamps.py
      - run: python scripts/update_capability_digest.py --check
      - name: Commit normalized tree
        run: |
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize version tokens and remove redundant visibility suffix [skip ci]"
          git push origin HEAD
