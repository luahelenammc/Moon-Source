name: Temporary visibility-neutral version normalization

on:
  push:
    branches:
      - meta/drop-public-version-suffix-final-20260909

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Normalize version identity across current Source tree
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          ROOT = Path('.')
          VISIBILITY = '-' + 'public'
          VERSION_SUFFIX = re.compile(r'(\d+(?:\.\d+)+)' + re.escape(VISIBILITY) + r'\b')

          def tracked_files():
              raw = subprocess.check_output(['git', 'ls-files', '-z'])
              return [p.decode('utf-8') for p in raw.split(b'\0') if p]

          # Rename any technical paths whose numeric version still encoded repository visibility.
          for old in sorted(tracked_files(), key=len, reverse=True):
              new = VERSION_SUFFIX.sub(r'\1', old)
              if new != old:
                  subprocess.run(['git', 'mv', old, new], check=True)

          # Normalize every tracked UTF-8 text surface, including historical release prose.
          for rel in tracked_files():
              path = ROOT / rel
              if not path.is_file() or path.suffix.lower() == '.zip':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              normalized = VERSION_SUFFIX.sub(r'\1', text)
              if normalized != text:
                  path.write_text(normalized, encoding='utf-8', newline='\n')

          rule = '''## Visibility-neutral version tokens

Repository visibility is an orthogonal publication/distribution state, not part of a version token. Moon Source versions therefore use bare release state only. Public/private exposure belongs in repository location, status, boundary and distribution metadata; never append a visibility qualifier to the numeric version.

Removing a legacy visibility qualifier is a bookkeeping-only normalization and does not by itself advance the numeric release. Future accepted updates continue to follow the governing increment rule on the bare number itself.

'''
          for rel in (
              'docs/REPOSITORY_NAMING_AND_VERSIONING.md',
              'templates/REPOSITORY_NAMING_AND_VERSIONING.md',
              'docs/VERSIONING_AND_RELEASES.md',
          ):
              path = ROOT / rel
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if '## Visibility-neutral version tokens' in text:
                  continue
              marker = '<!-- MOON-SOURCE-PUBLIC-STAMP -->'
              if marker in text:
                  text = text.replace(marker, rule + marker, 1)
              else:
                  text = text.rstrip() + '\n\n' + rule
              path.write_text(text, encoding='utf-8', newline='\n')

          guard = '''#!/usr/bin/env python3
# SPDX-FileCopyrightText: 2026 Lua Helena Moon Martins Cardoso (Moon)
# SPDX-License-Identifier: Apache-2.0
"""Reject repository-visibility qualifiers encoded inside numeric versions."""

from __future__ import annotations

import re
import subprocess
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
VISIBILITY = "-" + "public"
BAD = re.compile(r"\\d+(?:\\.\\d+)+" + re.escape(VISIBILITY) + r"\\b")
SKIP_SUFFIXES = {".zip", ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".woff", ".woff2", ".ttf", ".pyc"}


def main() -> None:
    raw = subprocess.check_output(["git", "ls-files", "-z"], cwd=ROOT)
    violations = []
    for item in (p for p in raw.split(b"\\0") if p):
        rel = item.decode("utf-8")
        if BAD.search(rel):
            violations.append(f"path: {rel}")
        path = ROOT / rel
        if not path.is_file() or path.suffix.lower() in SKIP_SUFFIXES:
            continue
        try:
            text = path.read_text(encoding="utf-8")
        except UnicodeDecodeError:
            continue
        if BAD.search(text):
            violations.append(f"text: {rel}")
    if violations:
        raise SystemExit("visibility-qualified numeric versions are forbidden:\\n- " + "\\n- ".join(violations))
    print("version visibility guard passed")


if __name__ == "__main__":
    main()

# MOON-SOURCE-PUBLIC-STAMP
# 🌙 Moon Source · Lua Helena Moon Martins Cardoso (Moon) + Áurion (AI-assisted) · Licensing: https://github.com/luahelenammc/Moon-Source/blob/main/LICENSING.md · Use & attribution: https://github.com/luahelenammc/Moon-Source/blob/main/MOON_SOURCE_USE_AND_ATTRIBUTION.md · Full source: https://github.com/luahelenammc/Moon-Source/archive/refs/heads/main.zip
'''
          (ROOT / 'scripts/check_version_visibility.py').write_text(guard, encoding='utf-8', newline='\n')

          # Refresh all standalone canonical fingerprints and deterministic packages.
          registry_path = ROOT / 'registry/public-capabilities.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          registered_packages = set()
          for cap in registry['capabilities']:
              dist = cap.get('distribution') or {}
              if not dist.get('standalone'):
                  continue
              canonical = ROOT / cap['canonical_path']
              dist['canonical_sha256'] = hashlib.sha256(canonical.read_bytes()).hexdigest()
              package = ROOT / dist['package_path']
              registered_packages.add(package.resolve())
              if not dist.get('composite'):
                  package.parent.mkdir(parents=True, exist_ok=True)
                  info = zipfile.ZipInfo(canonical.name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  with zipfile.ZipFile(package, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
                      archive.writestr(info, canonical.read_bytes())
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Normalize legacy textual payloads in other ZIPs too, including the AI Kernel package.
          for package in sorted((ROOT / 'downloads').glob('*.zip')):
              if package.resolve() in registered_packages:
                  continue
              try:
                  with zipfile.ZipFile(package, 'r') as source:
                      entries = [(i, source.read(i.filename)) for i in source.infolist()]
              except zipfile.BadZipFile:
                  continue
              changed = False
              with tempfile.NamedTemporaryFile(delete=False, suffix='.zip') as tmp:
                  tmp_path = Path(tmp.name)
              with zipfile.ZipFile(tmp_path, 'w') as target:
                  for info, data in entries:
                      new_name = VERSION_SUFFIX.sub(r'\1', info.filename)
                      try:
                          text = data.decode('utf-8')
                      except UnicodeDecodeError:
                          new_data = data
                      else:
                          new_data = VERSION_SUFFIX.sub(r'\1', text).encode('utf-8')
                      if new_name != info.filename or new_data != data:
                          changed = True
                      new_info = zipfile.ZipInfo(new_name, date_time=info.date_time)
                      new_info.compress_type = info.compress_type
                      new_info.comment = info.comment
                      new_info.extra = info.extra
                      new_info.internal_attr = info.internal_attr
                      new_info.external_attr = info.external_attr
                      new_info.create_system = info.create_system
                      target.writestr(new_info, new_data)
              if changed:
                  package.write_bytes(tmp_path.read_bytes())
              tmp_path.unlink(missing_ok=True)
          PY

      - name: Refresh digest and validate normalized tree
        shell: bash
        run: |
          python scripts/update_capability_digest.py
          python scripts/check_version_visibility.py
          python scripts/check_links.py
          python scripts/validate_public_capabilities.py
          python scripts/check_kernel_package.py
          python scripts/check_title_version_separation.py
          python scripts/test_title_version_separation.py
          python scripts/check_public_stamps.py
          python scripts/test_public_stamps.py
          python scripts/update_capability_digest.py --check

      - name: Commit normalized tree and retire temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-normalize-version-visibility.yml
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize version tokens and remove redundant visibility suffix [skip ci]"
          git push origin HEAD
