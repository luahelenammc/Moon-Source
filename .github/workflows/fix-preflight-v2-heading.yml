name: Fix Preflight V2 heading sequence

on:
  push:
    branches: [fix/preflight-v2-heading-sequence-20260907]
    paths:
      - ".github/workflows/fix-preflight-v2-heading.yml"

permissions:
  contents: write

jobs:
  fix-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preflight-v2-heading-sequence-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Repair heading, package, and fingerprint
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib, json
          p=Path('portables/preflight/PREFLIGHT_V2.md')
          t=p.read_text(encoding='utf-8')
          old='## 3. Why Preflight exists'
          if t.count(old)!=1:
              raise SystemExit(f'expected one duplicated Why heading, found {t.count(old)}')
          t=t.replace(old,'## 2. Why Preflight exists',1)
          if '## 2. Why Preflight exists' not in t or '## 3. Precise definition' not in t:
              raise SystemExit('heading sequence repair failed')
          p.write_text(t,encoding='utf-8',newline='\n')
          data=p.read_bytes()
          z=Path('downloads/preflight-v2.zip')
          with ZipFile(z,'w',compression=ZIP_DEFLATED) as zf:
              zi=ZipInfo('PREFLIGHT_V2.md')
              zi.date_time=(2026,9,7,0,0,0)
              zi.compress_type=ZIP_DEFLATED
              zf.writestr(zi,data)
          sha=hashlib.sha256(data).hexdigest()
          rp=Path('registry/public-portables.json')
          registry=json.loads(rp.read_text(encoding='utf-8'))
          pre=next(x for x in registry['portables'] if x['id']=='preflight')
          pre['canonical_sha256']=sha
          rp.write_text(json.dumps(registry,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          print('updated Preflight SHA-256',sha)
          PY
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input reuse cffconvert
      - name: Validate repository
        run: |
          python scripts/check_licensing.py
          reuse lint
          cffconvert --validate --infile CITATION.cff
          python scripts/check_links.py
          python scripts/validate_portables.py
          python scripts/validate_public_components.py
          python scripts/test_check_links.py
          python scripts/check_public_stamps.py
          python scripts/test_public_stamps.py
          python scripts/update_component_digest.py --check
      - name: Remove one-shot machinery and runner caches
        run: |
          rm .github/workflows/fix-preflight-v2-heading.yml
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit clean repair
        run: |
          git config user.name "Lua H. Moon M. C."
          git config user.email "luahelenammc@gmail.com"
          git add -A
          git status --short
          git commit -m "Fix Preflight V2 heading sequence"
          git push origin HEAD:fix/preflight-v2-heading-sequence-20260907
