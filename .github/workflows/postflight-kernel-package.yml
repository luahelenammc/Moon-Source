name: Postflight kernel package rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/postflight-kernel-package.yml'
      - 'MOON_SOURCE_AI_KERNEL.md'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact single-file kernel package
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          source = Path('MOON_SOURCE_AI_KERNEL.md')
          package = Path('downloads/moon-source-ai-kernel.zip')
          data = source.read_bytes()

          info = zipfile.ZipInfo(source.name)
          info.date_time = (1980, 1, 1, 0, 0, 0)
          info.compress_type = zipfile.ZIP_STORED
          info.external_attr = 0

          with zipfile.ZipFile(package, 'w') as zf:
              zf.writestr(info, data)

          with zipfile.ZipFile(package, 'r') as zf:
              assert zf.namelist() == [source.name]
              assert zf.read(source.name) == data
          PY
      - name: Commit package if changed
        run: |
          if git diff --quiet -- downloads/moon-source-ai-kernel.zip; then
            echo 'Kernel package already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/moon-source-ai-kernel.zip
          git commit -m 'build: refresh AI Kernel download package'
          git push
