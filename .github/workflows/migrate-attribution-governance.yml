name: One-time attribution governance migration

on:
  pull_request:
    branches: [main]
    paths:
      - "*.md"
      - "**/*.md"
      - "registry/**"
      - "scripts/**"
      - ".github/workflows/migrate-attribution-governance.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/split-attribution-governance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/split-attribution-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update active attribution references
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')
          files = subprocess.check_output(
              ['git', 'ls-files', '-z', '*.md'], text=False
          ).decode('utf-8').split('\0')

          replacements = [
              ('[Attribution and Lineage](../ATTRIBUTION_AND_LINEAGE.md)', '[Moon Source Use & Attribution](../MOON_SOURCE_USE_AND_ATTRIBUTION.md)'),
              ('[Attribution and Lineage](ATTRIBUTION_AND_LINEAGE.md)', '[Moon Source Use & Attribution](MOON_SOURCE_USE_AND_ATTRIBUTION.md)'),
              ('https://github.com/luahelenammc/Moon-Source/blob/main/ATTRIBUTION_AND_LINEAGE.md', 'https://github.com/luahelenammc/Moon-Source/blob/main/MOON_SOURCE_USE_AND_ATTRIBUTION.md'),
              ('`ATTRIBUTION_AND_LINEAGE.md`', '`MOON_SOURCE_USE_AND_ATTRIBUTION.md`'),
          ]

          for item in files:
              if not item or item == 'ATTRIBUTION_AND_LINEAGE.md' or item.startswith('archive/'):
                  continue
              path = root / item
              content = path.read_text(encoding='utf-8')
              updated = content
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != content:
                  path.write_text(updated, encoding='utf-8', newline='\n')

          readme = root / 'README.md'
          content = readme.read_text(encoding='utf-8')
          old_row = '| You want to publish, mirror or adapt one of the public materials | [📐 Portable Design Contract](docs/PORTABLE_DESIGN_CONTRACT.md), [🗂️ registry](registry/PUBLIC_PORTABLES.md) and [📚 versioning rules](docs/VERSIONING_AND_RELEASES.md) | Find canonical paths, freshness rules, attribution guidance, mirror rules and release boundaries |'
          new_rows = '| You want to use, cite, teach, adapt or redistribute Moon Source itself | [🌙 Moon Source Use & Attribution](MOON_SOURCE_USE_AND_ATTRIBUTION.md) | Separate operational use from reuse rights, preserve canonical authorship and identify local adaptations honestly |\n' + old_row
          if old_row not in content:
              raise SystemExit('README use table anchor not found')
          content = content.replace(old_row, new_rows, 1)
          content = content.replace(
              '- 🧬 [Moon Source Use & Attribution](MOON_SOURCE_USE_AND_ATTRIBUTION.md) records authorship and historical relation.\n- 🧬 [Credits & Attribution Ops](docs/CREDITS_ATTRIBUTION_OPS.md) applies that lineage across reuse, adaptation, mirrors and generated outputs.',
              '- 🌙 [Moon Source Use & Attribution](MOON_SOURCE_USE_AND_ATTRIBUTION.md) governs project authorship, operational use, reuse boundaries, adaptations and the compact repository watermark.\n- 🧬 [Credits & Attribution Ops](docs/CREDITS_ATTRIBUTION_OPS.md) is the reusable meta-operational module for provenance, adaptation, mirrors and permission scope in any source-governed project.'
          )
          readme.write_text(content, encoding='utf-8', newline='\n')
          PY

      - name: Normalize compact watermark and portable hashes
        run: python scripts/apply_public_stamps.py

      - name: Validate migrated tree
        run: |
          python scripts/check_links.py
          python scripts/validate_portables.py
          python scripts/test_check_links.py
          python scripts/check_public_stamps.py
          if git grep -n 'ATTRIBUTION_AND_LINEAGE.md' -- '*.md' ':!ATTRIBUTION_AND_LINEAGE.md' ':!archive/**'; then
            echo 'Active legacy attribution references remain.' >&2
            exit 1
          fi

      - name: Remove one-time migration workflow and commit migration
        run: |
          rm .github/workflows/migrate-attribution-governance.yml
          git config user.name "Moon Source migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration delta to commit."
          else
            git commit -m "Apply attribution governance split repository-wide"
            git push origin HEAD:agent/split-attribution-governance
          fi

# MOON-SOURCE-PUBLIC-STAMP
# 🌙 Moon Source · Lua Helena Moon Martins Cardoso (Moon) + Áurion (AI-assisted) · Use & attribution: https://github.com/luahelenammc/Moon-Source/blob/main/MOON_SOURCE_USE_AND_ATTRIBUTION.md · Full source: https://github.com/luahelenammc/Moon-Source/archive/refs/heads/main.zip
