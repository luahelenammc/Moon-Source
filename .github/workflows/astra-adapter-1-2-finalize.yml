name: Finalize Astra Adapter 1.2

on:
  push:
    paths:
      - '.github/workflows/astra-adapter-1-2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Astra 1.2 migration
        run: python .github/scripts/astra_adapter_1_2_finalize.py
      - name: Validate public surfaces
        run: |
          python scripts/check_links.py
          python scripts/validate_public_capabilities.py
          python scripts/check_public_stamps.py
          python scripts/check_title_version_separation.py
      - name: Commit finalized release
        run: |
          git config user.name 'Lua H. Moon M. C.'
          git config user.email 'luahelenammc@gmail.com'
          rm .github/workflows/astra-adapter-1-2-finalize.yml
          rm .github/scripts/astra_adapter_1_2_finalize.py
          git add -A
          git commit -m 'Release Astra Strategy Adapter 1.2 setup contract'
          git push
