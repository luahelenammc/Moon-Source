name: One-shot version visibility normalization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meta/drop-public-version-suffix-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/_one_shot_version_visibility_normalize.py
      - run: python scripts/update_capability_digest.py
      - run: python scripts/check_version_visibility.py
      - run: python scripts/check_links.py
      - run: python scripts/validate_public_capabilities.py
      - run: python scripts/check_kernel_package.py
      - run: python scripts/check_title_version_separation.py
      - run: python scripts/test_title_version_separation.py
      - run: python scripts/check_public_stamps.py
      - run: python scripts/test_public_stamps.py
      - run: python scripts/update_capability_digest.py --check
      - name: Commit normalized Moon Source branch
        run: |
          git config user.name "Lua H. Moon M. C."
          git config user.email "luahelenammc@gmail.com"
          git add -A
          git commit -m "meta: make version tokens visibility-neutral"
          git push origin HEAD:meta/drop-public-version-suffix-20260909
      - name: Retire runner from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/run-version-visibility-normalization.yml
          git config user.name "Lua H. Moon M. C."
          git config user.email "luahelenammc@gmail.com"
          git commit -m "chore: retire one-shot version normalization workflow"
          git push origin main
