name: Temporary receipt transport package build
on:
  push:
    branches: ["upstream/receipt-transport-integrity"]
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/upstream/receipt-transport-integrity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild and validate skills
        run: |
          python scripts/build_public_skills.py
          python scripts/build_public_skills.py --check
          python scripts/test_public_skill_packages.py
      - name: Commit only verified affected public skill packages to this branch
        run: |
          git add downloads/skills/moon-failure-foundry.zip downloads/skills/moon-lifecycle-workspace-router.zip downloads/skills/moon-operational-devices.zip downloads/skills/moon-operational-reliability.zip downloads/skills/moon-preflight.zip downloads/skills/moon-procedural-projection.zip
          git diff --name-only --exit-code -- downloads/skills
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build affected skills from verified receipt transport sources"
          git push origin HEAD:refs/heads/upstream/receipt-transport-integrity
