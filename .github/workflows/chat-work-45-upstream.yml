name: Chat-Work 4.5 bounded exhaustiveness upstream

on:
  push:
    branches:
      - chat-work-4.5-bounded-exhaustiveness-20260909
    paths:
      - .github/workflows/chat-work-45-upstream.yml

permissions:
  contents: write

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-work-4.5-bounded-exhaustiveness-20260909
          fetch-depth: 0

      - name: Apply release patch
        run: python .github/scripts/release_chat_work_45.py

      - name: Refresh capability digest
        run: python scripts/update_capability_digest.py

      - name: Validate release invariants
        run: |
          python scripts/validate_public_capabilities.py
          python scripts/check_title_version_separation.py
          python scripts/check_public_stamps.py
          python scripts/check_links.py

      - name: Commit release to branch and remove one-shot machinery
        run: |
          rm .github/workflows/chat-work-45-upstream.yml
          rm .github/scripts/release_chat_work_45.py
          git config user.name "moon-source-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release Chat–Work 4.5 bounded exhaustiveness"
          git push origin HEAD:chat-work-4.5-bounded-exhaustiveness-20260909
