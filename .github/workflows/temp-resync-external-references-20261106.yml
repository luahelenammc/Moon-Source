# One-shot branch-local deterministic package regeneration. Removed before merge.
name: Temporary evidence-linked package resync
on:
  push:
    branches:
      - docs/observed-third-party-references-20261106

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'luahelenammc/Moon-Source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/observed-third-party-references-20261106
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/build_public_skills.py
      - run: python scripts/build_public_skills.py --check
      - name: Publish regenerated ZIPs to this branch only
        run: |
          git add downloads/skills/*.zip
          if git diff --cached --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(skills): synchronize evidence-linked skill packages"
          git push origin HEAD:docs/observed-third-party-references-20261106
