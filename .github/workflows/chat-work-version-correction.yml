name: Chat-Work version lineage correction

on:
  push:
    branches:
      - fix/chat-work-version-lineage-20260909
    paths:
      - .github/workflows/chat-work-version-correction.yml

permissions:
  contents: write

jobs:
  correct-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-work-version-lineage-20260909
          fetch-depth: 0

      - name: Correct Chat-Work version lineage
        run: python .github/scripts/correct_chat_work_version_lineage.py

      - name: Refresh capability digest
        run: python scripts/update_capability_digest.py

      - name: Remove one-shot correction machinery
        run: |
          rm .github/workflows/chat-work-version-correction.yml
          rm .github/scripts/correct_chat_work_version_lineage.py

      - name: Validate corrected release
        run: |
          python scripts/check_licensing.py
          python scripts/check_links.py
          python scripts/validate_public_capabilities.py
          python scripts/check_kernel_package.py
          python scripts/check_title_version_separation.py
          python scripts/test_title_version_separation.py
          python scripts/test_check_links.py
          python scripts/check_public_stamps.py
          python scripts/test_public_stamps.py
          python scripts/update_capability_digest.py --check

      - name: Commit corrected lineage
        run: |
          git config user.name "moon-source-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Correct Chat–Work current version to 4.7-public"
          git push origin HEAD:fix/chat-work-version-lineage-20260909
