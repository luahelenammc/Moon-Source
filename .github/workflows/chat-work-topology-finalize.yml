name: Finalize Chat-Work Astra topology

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chat-work-topology-finalize.yml"
      - "portables/chat-work/**"
      - "docs/CHAT_WORK_ASTRA_ADAPTER.md"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Align metadata and rebuild package
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          registry = Path('registry/public-capabilities.json')
          text = registry.read_text(encoding='utf-8')
          old = 'Optional Astra strategy adapter at docs/CHAT_WORK_ASTRA_ADAPTER.md; subordinate to the canonical Chat–Work body and not a second capability identity'
          new = 'Optional Astra strategy adapter at portables/chat-work/astra/CHAT_WORK_ASTRA_ADAPTER.md; subordinate to the canonical Chat–Work body and not a second capability identity'
          if old not in text:
              raise SystemExit('Expected registry Astra locator not found')
          registry.write_text(text.replace(old, new, 1), encoding='utf-8')

          downloads = Path('DOWNLOADS.md')
          text = downloads.read_text(encoding='utf-8')
          old = 'Every current standalone package still contains exactly the self-onboarding canonical body — not the README facade.'
          new = 'Every current standalone package contains its self-onboarding canonical body rather than the README facade. Chat–Work additionally carries its subordinate Astra adapter because that adapter is part of the portable’s internal topology, not a separate capability.'
          if old not in text:
              raise SystemExit('Expected download-package sentence not found')
          downloads.write_text(text.replace(old, new, 1), encoding='utf-8')

          package = Path('downloads/chat-work-routing-protocol-v4.zip')
          package.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(package, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              zf.write('portables/chat-work/CHAT_WORK_ROUTING_PROTOCOL_V4.md', 'CHAT_WORK_ROUTING_PROTOCOL_V4.md')
              zf.write('portables/chat-work/astra/CHAT_WORK_ASTRA_ADAPTER.md', 'astra/CHAT_WORK_ASTRA_ADAPTER.md')
          PY
      - name: Commit finalized topology
        run: |
          rm .github/workflows/chat-work-topology-finalize.yml
          git config user.name "Lua H. Moon M. C."
          git config user.email "luahelenammc@gmail.com"
          git add -A
          git commit -m "Finalize Chat-Work Astra submodule packaging"
          git push origin HEAD:main
