# Temporary one-branch repair workflow. Delete after successful execution.
name: Temporary deterministic skill bundle resync
on:
  push:
    branches:
      - docs/verified-community-use-reporting-20261106
permissions:
  contents: write
jobs:
  resync:
    if: github.repository == 'luahelenammc/Moon-Source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/verified-community-use-reporting-20261106
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/build_public_skills.py
      - run: python scripts/build_public_skills.py --check
      - name: Commit deterministic skill packages to this branch only
        run: |
          git add downloads/skills/*.zip
          if git diff --cached --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(skills): resync deterministic bundles against current canonicals"
          git push origin HEAD:docs/verified-community-use-reporting-20261106
