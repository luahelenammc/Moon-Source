name: Validate public repository

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
  pull_request:
    paths:
      - "*.md"
      - "**/*.md"
      - "registry/**"
      - "scripts/**"
      - "downloads/**"
      - "LICENSE"
      - "LICENSES/**"
      - "LICENSING.md"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - "CITATION.cff"
      - "REUSE.toml"
      - "CONTRIBUTING.md"
      - "MAINTAINERS.md"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "*.md"
      - "**/*.md"
      - "registry/**"
      - "scripts/**"
      - "downloads/**"
      - "LICENSE"
      - "LICENSES/**"
      - "LICENSING.md"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - "CITATION.cff"
      - "REUSE.toml"
      - "CONTRIBUTING.md"
      - "MAINTAINERS.md"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  local-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check --no-input reuse cffconvert
      - run: python scripts/moon_source.py validate

  remote-mirror-drift:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/moon_source.py mirror --check

