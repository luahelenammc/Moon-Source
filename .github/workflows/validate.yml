name: Validate public repository

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
  pull_request:
    paths:
      - "*.md"
      - "**/*.md"
      - "registry/**"
      - "scripts/**"
      - "LICENSE"
      - "LICENSES/**"
      - "LICENSING.md"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - "CITATION.cff"
      - "REUSE.toml"
      - "CONTRIBUTING.md"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "*.md"
      - "**/*.md"
      - "registry/**"
      - "scripts/**"
      - "LICENSE"
      - "LICENSES/**"
      - "LICENSING.md"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - "CITATION.cff"
      - "REUSE.toml"
      - "CONTRIBUTING.md"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  local-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check --no-input reuse cffconvert
      - run: python scripts/check_licensing.py
      - run: reuse lint
      - run: cffconvert --validate --infile CITATION.cff
      - run: python scripts/check_links.py
      - run: python scripts/validate_portables.py
      - run: python scripts/validate_public_components.py
      - run: python scripts/test_check_links.py
      - run: python scripts/check_public_stamps.py
      - run: python scripts/test_public_stamps.py
      - run: python scripts/update_component_digest.py --check

  remote-mirror-drift:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/check_mirror_sync.py

