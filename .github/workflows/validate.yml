name: Validate public repository

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "*.md"
      - "**/*.md"
      - "registry/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "*.md"
      - "**/*.md"
      - "registry/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  local-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/check_links.py
      - run: python scripts/validate_portables.py
      - run: python scripts/test_check_links.py

  remote-mirror-drift:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/check_mirror_sync.py
