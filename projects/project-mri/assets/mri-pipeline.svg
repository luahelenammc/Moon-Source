<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Project MRI governed context pipeline</title>
  <desc id="desc">A pipeline from a bounded corpus through evidence and human review to a sandbox export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#182b3b"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#172235"/><stop offset="1" stop-color="#202851"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#59d6cf"/></marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" fill="#59d6cf" font-family="system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="3">PROJECT MRI</text>
  <text x="70" y="116" fill="#eef2fa" font-family="system-ui,sans-serif" font-size="32" font-weight="750">Governed context, made inspectable.</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(70 190)"><rect width="150" height="110" rx="16" fill="url(#card)" stroke="#415074"/><text x="18" y="35" fill="#c8c1ff" font-size="13" font-weight="700">01 · INPUT</text><text x="18" y="66" fill="#eef2fa" font-size="17" font-weight="700">Folder / ZIP</text><text x="18" y="90" fill="#a8b2c2" font-size="12">bounded corpus</text></g>
    <g transform="translate(270 190)"><rect width="150" height="110" rx="16" fill="url(#card)" stroke="#415074"/><text x="18" y="35" fill="#c8c1ff" font-size="13" font-weight="700">02 · READ</text><text x="18" y="66" fill="#eef2fa" font-size="17" font-weight="700">Inventory</text><text x="18" y="90" fill="#a8b2c2" font-size="12">hashes + lines</text></g>
    <g transform="translate(470 190)"><rect width="150" height="110" rx="16" fill="url(#card)" stroke="#415074"/><text x="18" y="35" fill="#c8c1ff" font-size="13" font-weight="700">03 · FIND</text><text x="18" y="66" fill="#eef2fa" font-size="17" font-weight="700">Diagnostics</text><text x="18" y="90" fill="#a8b2c2" font-size="12">evidence-backed</text></g>
    <g transform="translate(670 190)"><rect width="150" height="110" rx="16" fill="url(#card)" stroke="#415074"/><text x="18" y="35" fill="#c8c1ff" font-size="13" font-weight="700">04 · MAP</text><text x="18" y="66" fill="#eef2fa" font-size="17" font-weight="700">Authority</text><text x="18" y="90" fill="#a8b2c2" font-size="12">candidates + history</text></g>
    <g transform="translate(870 190)"><rect width="150" height="110" rx="16" fill="url(#card)" stroke="#415074"/><text x="18" y="35" fill="#c8c1ff" font-size="13" font-weight="700">05 · DECIDE</text><text x="18" y="66" fill="#eef2fa" font-size="17" font-weight="700">Human review</text><text x="18" y="90" fill="#a8b2c2" font-size="12">approve / reject / defer</text></g>
    <path d="M225 245H260M425 245H460M625 245H660M825 245H860" stroke="#59d6cf" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <text x="70" y="360" fill="#a8b2c2" font-family="system-ui,sans-serif" font-size="15">The output is a sandbox record and portable report. The original corpus remains untouched.</text>
</svg>
