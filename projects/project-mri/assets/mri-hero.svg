<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Project MRI hero visual</title>
  <desc id="desc">A dark infrastructure-style card with the Project MRI name and its source-of-truth message.</desc>
  <defs><radialGradient id="glow" cx="82%" cy="10%" r="70%"><stop stop-color="#5444a6" stop-opacity=".75"/><stop offset="1" stop-color="#0a1020" stop-opacity="0"/></radialGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#59d6cf" stop-opacity="0"/><stop offset=".5" stop-color="#59d6cf"/><stop offset="1" stop-color="#8f7bff" stop-opacity="0"/></linearGradient></defs>
  <rect width="1200" height="630" rx="34" fill="#0a1020"/>
  <rect width="1200" height="630" rx="34" fill="url(#glow)"/>
  <path d="M80 138H1120M80 482H1120" stroke="url(#line)" stroke-width="2"/>
  <text x="90" y="112" fill="#59d6cf" font-family="system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="4">INFRAJAM 2026 · OPEN SOURCE</text>
  <text x="90" y="270" fill="#f3f5fb" font-family="system-ui,sans-serif" font-size="92" font-weight="800" letter-spacing="-5">Project MRI</text>
  <text x="96" y="332" fill="#c5bdff" font-family="system-ui,sans-serif" font-size="28" font-weight="600">See what your AI is being asked to believe.</text>
  <text x="96" y="400" fill="#a8b2c2" font-family="system-ui,sans-serif" font-size="20">Evidence · authority · human review · no silent mutation</text>
  <g transform="translate(96 520)" font-family="system-ui,sans-serif"><circle cx="9" cy="-7" r="8" fill="#59d6cf"/><text x="30" y="0" fill="#d7dfec" font-size="18">Governed context infrastructure for AI-assisted projects</text></g>
</svg>
