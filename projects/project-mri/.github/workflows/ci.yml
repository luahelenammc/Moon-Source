name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install --no-deps -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run reproducible fixture evaluation
        run: python -m mri eval fixtures/northstar --output "${{ runner.temp }}/mri-northstar"

      - name: Compile Python sources
        run: python -m compileall -q mri server.py
